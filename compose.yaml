name: ardenfold

services:
    object-storage:
        image: ghcr.io/versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
        environment:
            ROOT_ACCESS_KEY: ${FILE_STORAGE_ACCESS_KEY_ID:?FILE_STORAGE_ACCESS_KEY_ID is required}
            ROOT_SECRET_KEY: ${FILE_STORAGE_SECRET_ACCESS_KEY:?FILE_STORAGE_SECRET_ACCESS_KEY is required}
            VGW_BACKEND: posix
            VGW_BACKEND_ARGS: /data/s3
            VGW_PORT: ":7070"
        ports:
            - "7070:7070"
        volumes:
            - object_storage_data:/data/s3

    postgres:
        image: postgres:18.6-bookworm
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
            POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
            POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
            POSTGRES_INITDB_ARGS: "--data-checksums"
        ports:
            - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./infrastructure/docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_RUNTIME_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        shm_size: 128mb
        stop_grace_period: 10s

volumes:
    object_storage_data:
        name: ardenfold-object-storage-data
    postgres_data:
        name: ardenfold-postgres-data
