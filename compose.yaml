name: ardenfold

services:
    postgres:
        image: postgres:18.6-bookworm
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
            POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
            POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
            POSTGRES_INITDB_ARGS: "--data-checksums"
        ports:
            - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./infrastructure/docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_RUNTIME_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        shm_size: 128mb
        stop_grace_period: 10s

volumes:
    postgres_data:
        name: ardenfold-postgres-data
