name: Quality

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

env:
    WORKOS_CLIENT_ID: client_ci
    WORKOS_API_KEY: test-only-api-key
    WORKOS_COOKIE_PASSWORD: test-only-cookie-password-32-bytes-minimum
    NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
    WORKOS_ISSUER: https://api.workos.com/
    WORKOS_JWKS_URL: https://api.workos.com/sso/jwks/client_ci
    AUTH_JWT_CLOCK_TOLERANCE_SECONDS: "5"
    ARDENFOLD_API_URL: http://localhost:3001

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run lint
              run: pnpm lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run typecheck
              run: pnpm typecheck

    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run tests
              run: pnpm test

            - name: Build API and workspace dependencies
              run: pnpm exec turbo run build --filter=@ardenfold/api...

            - name: Verify OpenAPI contract
              run: pnpm --filter @ardenfold/api openapi:check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run build
              run: pnpm build
