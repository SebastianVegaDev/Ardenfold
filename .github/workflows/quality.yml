name: Quality

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

permissions:
    contents: read

env:
    WORKOS_CLIENT_ID: client_ci
    WORKOS_API_KEY: test-only-api-key
    WORKOS_COOKIE_PASSWORD: test-only-cookie-password-32-bytes-minimum
    NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
    WORKOS_ISSUER: https://api.workos.com/
    WORKOS_JWKS_URL: https://api.workos.com/sso/jwks/client_ci
    AUTH_JWT_CLOCK_TOLERANCE_SECONDS: "5"
    ARDENFOLD_API_URL: http://localhost:3001

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run lint
              run: pnpm lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run typecheck
              run: pnpm typecheck

    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run tests
              run: pnpm test

            - name: Build API and workspace dependencies
              run: pnpm exec turbo run build --filter=@ardenfold/api...

            - name: Verify OpenAPI contract
              run: pnpm --filter @ardenfold/api openapi:check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Run build
              run: pnpm build

    platform-security:
        name: Platform security
        runs-on: ubuntu-latest
        env:
            WORKOS_CLIENT_ID: client_e2e
            WORKOS_API_KEY: sk_test_e2e_local_only
            WORKOS_API_HOSTNAME: 127.0.0.1
            WORKOS_API_HTTPS: "false"
            WORKOS_API_PORT: "4010"
            WORKOS_COOKIE_PASSWORD: ardenfold-e2e-cookie-password-at-least-32-bytes
            NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
            WORKOS_ISSUER: http://127.0.0.1:4010/
            WORKOS_JWKS_URL: http://127.0.0.1:4010/sso/jwks/client_e2e
            ARDENFOLD_API_URL: http://127.0.0.1:3001
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up workspace
              uses: ./.github/actions/setup-workspace

            - name: Start isolated PostgreSQL
              run: docker compose -f apps/e2e/compose.yaml up -d --wait

            - name: Install Chromium
              run: pnpm --filter @ardenfold/e2e exec playwright install --with-deps chromium

            - name: Run platform security suite
              run: pnpm test:security

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: platform-security-diagnostics
                  path: |
                      apps/e2e/playwright-report
                      apps/e2e/test-results
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Stop isolated PostgreSQL
              if: always()
              run: docker compose -f apps/e2e/compose.yaml down --volumes
