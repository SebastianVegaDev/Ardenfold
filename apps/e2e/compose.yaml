name: ardenfold-e2e

services:
    postgres:
        image: postgres:18.6-bookworm
        environment:
            POSTGRES_DB: ardenfold_e2e
            POSTGRES_USER: ardenfold_e2e_migrator
            POSTGRES_PASSWORD: e2e-migration-password
            POSTGRES_RUNTIME_USER: ardenfold_e2e_runtime
            POSTGRES_RUNTIME_PASSWORD: e2e-runtime-password
        ports:
            - "55432:5432"
        volumes:
            - ../../infrastructure/docker/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ardenfold_e2e_runtime -d ardenfold_e2e"]
            interval: 2s
            timeout: 5s
            retries: 20
            start_period: 5s
